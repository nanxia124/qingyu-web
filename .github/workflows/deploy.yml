name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.160.249.6
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*"
          target: "/home/ubuntu/qingyu-upload"
          overwrite: true
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.160.249.6
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu
            test -s /home/ubuntu/qingyu-upload/index.html
            sudo mkdir -p /var/www/qingyu-web
            sudo cp -a /home/ubuntu/qingyu-upload/. /var/www/qingyu-web/
            sudo chown -R www-data:www-data /var/www/qingyu-web
            sudo nginx -t && sudo systemctl reload nginx
            curl --fail --silent --show-error http://localhost/ -o /dev/null
            rm -rf /home/ubuntu/qingyu-upload
            echo "✅ Deploy completed successfully"

