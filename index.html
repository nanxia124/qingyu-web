    <title>LITZONE · 创作者工作台</title>
    <script>
      // 首屏主题：React 挂载前根据本地偏好 + 系统偏好挂 .dark，避免闪一下错主题
      (function () {
        try {
          var mode = "system";
          var raw = localStorage.getItem("infinite-canvas:theme_store");
          if (raw) {
            var parsed = JSON.parse(raw);
            var state = parsed && parsed.state ? parsed.state : {};
            if (state.mode === "light" || state.mode === "dark" || state.mode === "system") {
              mode = state.mode;
            } else if (state.theme === "light" || state.theme === "dark") {
              mode = state.theme; // 老版本数据迁移
            }
          }
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      body { margin: 0; background-color: #fafafa; }
      html.dark body { background-color: #171717; }
      #boot-splash { background: #fafafa !important; }
      html.dark #boot-splash { background: #151515 !important; }
      #boot-splash .boot-logo-svg { fill: #222; }
      html.dark #boot-splash .boot-logo-svg { fill: #e8e8e8; }
      #boot-splash .boot-wordmark { filter: none; }
      html.dark #boot-splash .boot-wordmark { filter: invert(1); }
      #boot-splash .boot-hint { color: #666; }
      html.dark #boot-splash .boot-hint { color: #8a8a8a; }
    </style>
