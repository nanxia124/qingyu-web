name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.160.249.6
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*"
          target: "/home/ubuntu/qingyu-upload"
          overwrite: true
          strip_components: 1

      - name: Upload Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.160.249.6
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "scripts/deploy/nginx-qingyu-web.conf"
          target: "/home/ubuntu/qingyu-upload"
          overwrite: true

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.160.249.6
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -eu
            test -s /home/ubuntu/qingyu-upload/index.html
            sudo mkdir -p /var/www/qingyu-web
            sudo cp -a /home/ubuntu/qingyu-upload/. /var/www/qingyu-web/
            sudo chown -R www-data:www-data /var/www/qingyu-web
            nginx_conf=$(find /home/ubuntu/qingyu-upload -name nginx-qingyu-web.conf -type f -print -quit)
            test -n "$nginx_conf"
            sudo install -m 0644 "$nginx_conf" /etc/nginx/sites-available/qingyu-web
            sudo ln -sfn /etc/nginx/sites-available/qingyu-web /etc/nginx/sites-enabled/qingyu-web
            sudo nginx -t && sudo systemctl reload nginx
            if [ -f /home/ubuntu/appwrite/.env ]; then
              sudo sed -i -E 's|^_APP_DOMAIN=.*|_APP_DOMAIN=litzone.art|; s|^_APP_DOMAIN_FUNCTIONS=.*|_APP_DOMAIN_FUNCTIONS=litzone.art|; s|^_APP_DOMAIN_SITES=.*|_APP_DOMAIN_SITES=litzone.art|; s|^_APP_DOMAIN_TARGET_A=.*|_APP_DOMAIN_TARGET_A=litzone.art|; s|^_APP_CONSOLE_DOMAIN=.*|_APP_CONSOLE_DOMAIN=litzone.art|; s|^_APP_OPTIONS_FORCE_HTTPS=.*|_APP_OPTIONS_FORCE_HTTPS=enabled|; s|^_APP_OPTIONS_ROUTER_FORCE_HTTPS=.*|_APP_OPTIONS_ROUTER_FORCE_HTTPS=disabled|' /home/ubuntu/appwrite/.env
              cd /home/ubuntu/appwrite
              printf '%s\n' 'services:' '  appwrite:' '    ports:' '      - "8081:80"' | sudo tee docker-compose.override.yml > /dev/null
              sudo docker compose up -d
            fi
            curl --fail --silent --show-error http://localhost/ -o /dev/null
            rm -rf /home/ubuntu/qingyu-upload
            echo "✅ Deploy completed successfully"

