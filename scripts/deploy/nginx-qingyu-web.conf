server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/qingyu-web;
    index index.html;
    server_name _;

    # 安全响应头（两 server 块统一；HSTS 只在 443 加）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # 登录请求体只需账号密码；限速由后端按账号执行，避免共享代理 IP 误伤用户。
    location = /api/admin/login {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 兼容证书验证目录；隐藏文件与误发布的部署资料一律不可下载。
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ^~ /scripts/deploy/ { return 404; }
    location ~* \.(conf|env|pem|key|sql|sh|ya?ml|bak)$ { return 404; }
    location ~* /(?:github_actions_deploy(?:\.pub)?|AGENTS\.md|package(?:-lock)?\.json)$ { return 404; }

    # AI API 后端（密钥管理、模型配置、请求代理）
    location /api/ {
        # 上传分片每次最多 16MB；关闭请求缓冲，避免 Nginx 将用户文件写入临时目录。
        client_max_body_size 64m;
        client_body_timeout 600s;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare 在源站前终止 HTTPS；对 Appwrite 必须传递外部协议。
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Appwrite API + Realtime
    location /v1/ {
        proxy_pass http://127.0.0.1:8081;
        # Appwrite OAuth 必须看到生产正式域名和外部 HTTPS，不能使用源站 IP 或 Cloudflare 到源站的 HTTP。
        proxy_set_header Host litzone.art;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host litzone.art;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Appwrite Console 使用专属本机端口，外部固定挂在 /console/ 下。
    location = /console { return 301 /console/; }
    location /console/ {
        rewrite ^/console/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host litzone.art;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host litzone.art;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # sub_filter 需要禁用 gzip
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/assets/' '="/console/assets/';
        sub_filter '="/logo.svg"' '="/console/logo.svg"';
        sub_filter '="/favicon.ico"' '="/console/favicon.ico"';
        sub_filter '="/apple-touch-icon.png"' '="/console/apple-touch-icon.png"';
        sub_filter '</head>' '<script src="/appwrite-zh.js"></script></head>';
    }

    # Umami 统计后台 + 前端埋点脚本（容器内 BASE_PATH 未生效，实际在根路径服务；
    # 此处 proxy_pass 加尾部斜杠，strip 掉 /umami/ 前缀转发到 3000 根路径）
    location /umami/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Static frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 公网域名通过 HTTPS 访问；证书由 Certbot 维护。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name litzone.art;

    # 安全响应头（与 80 块一致，另加 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/litzone.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litzone.art/privkey.pem;

    root /var/www/qingyu-web;
    index index.html;

    location = /api/admin/login {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ^~ /scripts/deploy/ { return 404; }
    location ~* \.(conf|env|pem|key|sql|sh|ya?ml|bak)$ { return 404; }
    location ~* /(?:github_actions_deploy(?:\.pub)?|AGENTS\.md|package(?:-lock)?\.json)$ { return 404; }

    location /api/ {
        # 上传分片每次最多 16MB；关闭请求缓冲，避免 Nginx 将用户文件写入临时目录。
        client_max_body_size 64m;
        client_body_timeout 600s;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8081;
        # 即使 Cloudflare 到源站使用 HTTP，也要把外部访问协议明确告诉 Appwrite。
        proxy_set_header Host litzone.art;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host litzone.art;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Appwrite Console 使用专属本机端口，外部固定挂在 /console/ 下。
    location = /console { return 301 /console/; }
    location /console/ {
        rewrite ^/console/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host litzone.art;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host litzone.art;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '="/assets/' '="/console/assets/';
        sub_filter '="/logo.svg"' '="/console/logo.svg"';
        sub_filter '="/favicon.ico"' '="/console/favicon.ico"';
        sub_filter '="/apple-touch-icon.png"' '="/console/apple-touch-icon.png"';
        sub_filter '</head>' '<script src="/appwrite-zh.js"></script></head>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
