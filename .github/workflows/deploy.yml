name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create deploy directory
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p /var/www/qingyu-web"

      - name: Upload dist
        run: |
          tar -czf dist.tar.gz -C dist .
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT || 22 }} \
            dist.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/qingyu-web/

      - name: Extract and reload
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /var/www/qingyu-web && tar -xzf dist.tar.gz && rm dist.tar.gz && sudo nginx -t && sudo systemctl reload nginx && echo '✅ Deploy completed'"

      - name: Clean up
        if: always()
        run: rm -f dist.tar.gz
